plugins {
    id 'com.android.application'
}

android {
    namespace 'com.replica.audiotool'
    compileSdk 34

    defaultConfig {
        applicationId 'com.replica.audiotool'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

configurations.all {
    // kotlin-stdlib 1.8 already contains the jdk7 and jdk8 parts; drop the older split artifacts.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
