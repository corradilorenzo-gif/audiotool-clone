name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check DSP core
        run: |
          mkdir -p /tmp/dsp
          javac -d /tmp/dsp app/src/main/java/com/replica/audiotool/dsp/*.java app/src/test/java/com/replica/audiotool/dsp/DspSelfTest.java
          java -cp /tmp/dsp com.replica.audiotool.dsp.DspSelfTest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audiotool-clone-debug
          path: app/build/outputs/apk/debug/*.apk
