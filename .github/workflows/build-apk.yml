name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/*/bin/sdkmanager | head -1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Check DSP core
        run: |
          mkdir -p /tmp/dsp
          javac -d /tmp/dsp app/src/main/java/com/replica/audiotool/dsp/*.java app/src/test/java/com/replica/audiotool/dsp/DspSelfTest.java
          java -cp /tmp/dsp com.replica.audiotool.dsp.DspSelfTest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        shell: bash
        run: set -o pipefail; gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 150 build.log > tail.log || true
          gh api -X POST repos/$GITHUB_REPOSITORY/issues -f title="build-apk failed (run $GITHUB_RUN_ID)" -F body=@tail.log --jq .html_url || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audiotool-clone-debug
          path: app/build/outputs/apk/debug/*.apk
